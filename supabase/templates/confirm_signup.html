<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light only">
    <meta name="supported-color-schemes" content="light only">
  </head>
  <body style="font-family: Arial, sans-serif; background-color: #f4f4f7; padding: 40px 0;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background: #ffffff; border-radius: 12px; padding: 32px; text-align: center;">
            <tr>
              <td>
                <img src="https://dpiktgzlnrrhasllbpyl.supabase.co/storage/v1/object/public/assets/reviewsvisor-invoice-logo.png"
                     alt="Reviewsvisor" width="160"
                     style="display: block; margin: 0 auto 20px auto;" />
                <h2 style="color: #111827; margin-bottom: 8px;">Confirm your signup</h2>
                <p style="color: #6b7280; font-size: 14px; margin-bottom: 24px;">
                  Enter this code to verify your email address:
                </p>
                <div style="font-size: 32px; font-weight: bold; letter-spacing: 8px; color: #2563eb; background: #eff6ff; border-radius: 8px; padding: 16px; margin-bottom: 24px;">
                  {{ .Token }}
                </div>
                <p style="color: #9ca3af; font-size: 12px;">
                  This code expires in 60 minutes. If you didn't request this, you can ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
